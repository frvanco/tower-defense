<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tower Defense</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="launcher"></div>
    <!-- Conteneur de toasts PROPRE au launcher : #toasts vit dans #app, qui est
         masque tant qu'on est sur les ecrans d'accueil/salon — y ecrire serait
         invisible. initToasts() bascule entre les deux selon la surface
         affichee (voir launcher.ts et main.ts). -->
    <div id="launcher-toasts"></div>
    <div id="app" hidden>
      <header id="topbar">
        <div id="topbar-stats">
          <div class="stat"><span class="label">Temps</span><span id="stat-elapsed" class="value">0:00</span></div>
          <div class="stat"><span class="label">Niveau</span><span id="stat-difficulty" class="value">Moyen</span></div>
          <div class="stat"><span class="label">Lives</span><span id="stat-lives" class="value">0</span></div>
          <div class="stat"><span class="label">Round</span><span id="stat-round" class="value">0</span></div>
        </div>
      </header>
      <div id="arena-bar">
        <button id="arena-prev" class="arena-arrow" type="button" aria-label="Arène précédente">‹</button>
        <div id="arena-pills"></div>
        <button id="arena-next" class="arena-arrow" type="button" aria-label="Arène suivante">›</button>
      </div>
      <main id="main">
        <div id="canvas-wrap">
          <canvas id="game-canvas"></canvas>
          <div id="toasts"></div>
          <div id="observation-bar" hidden>
            <button id="back-to-own-arena-btn">Accueil</button>
            <div id="observed-panel">
              <span id="observed-name"></span> — income <span id="observed-income"></span>
            </div>
          </div>
          <footer id="command-bar">
            <section id="cmd-info">
              <div id="cmd-info-empty" class="cmd-info-empty">Survolez ou sélectionnez un élément</div>
              <div id="cmd-info-tooltip" class="cmd-info-content" hidden>
                <div id="cmd-tooltip-name"></div>
                <div id="cmd-tooltip-lines"></div>
                <div id="cmd-tooltip-desc"></div>
              </div>
              <div id="cmd-info-selected" class="cmd-info-content" hidden>
                <!-- Deux icones, deux roles distincts et non interchangeables :
                     celle du TITRE montre ce qu'on possede, celle du BOUTON ce
                     qu'on achete. Les separer ainsi evite qu'une information
                     d'action soit lue comme une description de la tour posee
                     (retour direct : un apercu du palier suivant place dans la
                     zone descriptive se lisait comme le palier courant). -->
                <div class="selected-header">
                  <span id="selected-icon" class="selected-icon" aria-hidden="true"></span>
                  <span id="selected-name"></span>
                </div>
                <div id="selected-info"></div>
                <button id="upgrade-btn">
                  <span id="upgrade-btn-icon" class="upgrade-btn-icon" aria-hidden="true" hidden></span>
                  <span id="upgrade-btn-label"></span>
                </button>
                <button id="sell-btn"></button>
              </div>
            </section>
            <section id="cmd-grid">
              <div id="cmd-grid-build" class="cmd-tiles"></div>
              <div id="cmd-grid-send" class="cmd-shop-panel" hidden>
                <div id="cmd-shop-nav">
                  <button id="cmd-shop-prev" class="cmd-nav-arrow" type="button" aria-label="Palier précédent">‹</button>
                  <span id="cmd-shop-tier-name"></span>
                  <button id="cmd-shop-next" class="cmd-nav-arrow" type="button" aria-label="Palier suivant">›</button>
                  <button id="cmd-shop-unlock-btn" class="cmd-unlock-btn" type="button" hidden></button>
                </div>
                <div id="cmd-shop-tiles"></div>
              </div>
              <div id="cmd-grid-abilities" class="cmd-tiles" hidden>
                <p id="cmd-abilities-empty">Aucune abilité disponible pour le moment.</p>
              </div>
            </section>
            <section id="cmd-modes">
              <!-- Les trois modes sont TOUJOURS visibles, y compris celui qui
                   est actif : c'est un selecteur, pas un bouton « retour ». La
                   construction en faisait exception (masquee quand active), ce
                   qui la rendait invisible precisement quand on s'en servait. -->
              <button id="cmd-mode-build" class="cmd-mode-btn" type="button" aria-label="Construire des tours">
                <span class="cmd-mode-icon">🔨</span>
                <!-- Constructions en file (0 a 5) : badge d'angle, meme
                     convention que le compteur de stock des tuiles
                     (.cmd-tile-stock). Pose sur le bouton Construction plutot
                     qu'ajoute a la colonne : aucune place n'y est prise, donc
                     la barre garde exactement sa hauteur. -->
                <span id="cmd-build-queue" class="cmd-queue-badge" hidden></span>
              </button>
              <button id="cmd-mode-send" class="cmd-mode-btn" type="button" aria-label="Envoyer des créatures">
                <span class="cmd-mode-icon">🎺</span>
              </button>
              <button id="cmd-mode-abilities" class="cmd-mode-btn" type="button" aria-label="Abilités">
                <span class="cmd-mode-icon">✦</span>
              </button>
              <!-- Annule les constructions PLANIFIEES ; celle en cours va au
                   bout (voir cancelBuildQueue dans packages/sim). Desactive
                   tant qu'il n'y a rien a annuler. -->
              <button id="cmd-cancel-queue" class="cmd-cancel-btn" type="button" disabled
                      aria-label="Annuler les constructions planifiées">Annuler</button>
            </section>
            <aside id="cmd-resources">
              <div class="cmd-resource cmd-resource-gold">
                <div class="cmd-resource-label"><span class="cmd-resource-icon">🪙</span>Or</div>
                <span id="cmd-res-gold" class="cmd-resource-value">0</span>
              </div>
              <div class="cmd-resource cmd-resource-income">
                <div class="cmd-resource-label"><span class="cmd-resource-icon">📈</span>Income</div>
                <span id="cmd-res-income" class="cmd-resource-value">0</span>
              </div>
              <div class="cmd-resource cmd-resource-timer">
                <div class="cmd-resource-label"><span class="cmd-resource-icon">⏳</span>Prochain</div>
                <span id="cmd-res-timer" class="cmd-resource-value">0:00</span>
              </div>
            </aside>
          </footer>
          <div id="shop-unlock-confirm" hidden>
            <div id="shop-unlock-confirm-box">
              <h2 id="shop-unlock-confirm-title"></h2>
              <p id="shop-unlock-confirm-detail"></p>
              <dl id="shop-unlock-confirm-gold">
                <div><dt>Coût</dt><dd id="shop-unlock-confirm-cost"></dd></div>
                <div><dt>Or disponible</dt><dd id="shop-unlock-confirm-before"></dd></div>
                <div><dt>Or restant</dt><dd id="shop-unlock-confirm-after"></dd></div>
              </dl>
              <div id="shop-unlock-confirm-actions">
                <button id="shop-unlock-confirm-btn">Confirmer</button>
                <button id="shop-unlock-cancel-btn">Annuler</button>
              </div>
            </div>
          </div>
          <div id="game-over" hidden>
            <div id="game-over-box">
              <h2 id="game-over-title">Game over</h2>
              <p id="game-over-detail"></p>
              <button id="restart-btn">Rejouer</button>
              <button id="exit-to-menu-btn">Retour à l'accueil</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/launcher.ts"></script>
  </body>
</html>
